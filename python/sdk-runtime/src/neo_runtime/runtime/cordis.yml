# Bundled default config. The runtime still requires an explicit
# $NEO_CORDIS_CONFIG or argv path; the SDK injects this path for bundled
# zero-config launches. SDK-set session-root and cwd variables have manual-run fallbacks.

# Stdio JSON-RPC server entry; without it the agent has no SDK client.
- id: sdk-jsonrpc-server
  name: '@neo/sdk-jsonrpc-server'

# Agent spine; the SDK server creates agents per sessionId.
- id: agent-core
  name: '@neo/agent-spine-demo'
  config:
    workspaceContext:
      maxBytes: 65536

# One hand-declared OpenAI-compatible route, kept on the `deepseek-official`
# id the SDK initializes by default. LLM_BASE_URL selects the endpoint
# (default: a local llama-server) and LLM_API_KEY resolves per request from the
# launching environment, so this file names no secret. The SDK exports the
# session's model as LLM_MODEL, so the route serves exactly the model it requests.
- id: llm-pi-ai
  name: '@neo/llm-pi-ai'
  config:
    providers:
      deepseek-official:
        api: openai-completions
        baseURL: !!js process.env.LLM_BASE_URL ?? 'http://127.0.0.1:8080/v1'
        apiKeyEnv: LLM_API_KEY
        models:
          - id: !!js process.env.LLM_MODEL ?? 'deepseek-v4-flash'

# JSONL persistence; $NEO_SESSION_ROOT wins over ./.sessions in the process cwd.
- id: sessions
  name: '@neo/session-persistence-jsonl'
  config:
    root: !!js process.env.NEO_SESSION_ROOT ?? './.sessions'

# Persistence owns durable storage; this separate policy explicitly selects
# the request, tool-dispatch, and completed-step durability checkpoints.
- id: session-checkpoints
  name: '@neo/session-checkpoint-policy'

# Local bash executor; $NEO_CWD wins over the process cwd.
# Managed child-process groups for the bash executor (spawn/kill/output plumbing).
- id: subprocess
  name: '@neo/subprocess-local'

- id: bash
  name: '@neo/bash-local'
  config:
    cwd: !!js process.env.NEO_CWD ?? process.cwd()

# Local filesystem provider for workspace instruction loading. This does not
# expose model-facing file tools by itself.
- id: fs-local
  name: '@neo/fs-local'
  config:
    cwd: !!js process.env.NEO_CWD ?? process.cwd()

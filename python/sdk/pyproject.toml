[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "neo-sdk"
version = "0.0.0.dev0"
description = "Python SDK for NEO"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "SkyVanguard" }]
dependencies = [
  "pydantic>=2.14.1,<3",
  "neo-runtime-bin==0.0.0.dev0",
]

[project.urls]
Homepage = "https://github.com/skyvanguard/NEO"
Documentation = "https://github.com/skyvanguard/NEO/blob/master/python/sdk/README.md"
Issues = "https://github.com/skyvanguard/NEO/issues"
Source = "https://github.com/skyvanguard/NEO"

[dependency-groups]
test = ["pytest>=9.2.0"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/neo_sdk"]

# Editable installs see runtime executables injected after installation instead
# of freezing a wheel snapshot.
[tool.uv.sources]
neo-runtime-bin = { path = "../sdk-runtime", editable = true }

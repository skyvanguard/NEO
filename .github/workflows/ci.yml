# CI del fork NEO (skyvanguard/NEO).
#
# El workflow del proyecto upstream dependia de runners self-hosted
# (Wine, dsh-win-ci) que este fork no tiene. Este es un CI Linux minimo y
# suficiente para el fork: construye la lib, corre hygiene (knip, publint,
# constraints, licencias, invariantes de paquete y de build —que atrapan una
# dep runtime no declarada en los artefactos typert, la clase de fallo que
# rompio un deploy—, config de Cordis, tipos NodeNext, clausura de runtime),
# el typecheck, el lint y los tests con el gate de cobertura de AGENTS.md:
# 100 % por archivo en packages/*/*/src (en Linux corren las suites que
# Windows excluye: hooks, bash, subprocess). Sin ese gate, el codigo propio
# del fork quedo sin tests sin que nada lo frenara.
name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux node 22 / gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          # No compartir el destino por defecto de pnpm/action-setup entre runners.
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      # Las suites de sandbox/bash necesitan bubblewrap en el runner.
      - name: install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: install deps
        run: pnpm install --frozen-lockfile
      - name: build lib
        run: pnpm run build:lib
      # Incluye verify-built-package-invariants (deps runtime no declaradas).
      - name: hygiene
        run: pnpm run hygiene
      - name: typecheck
        run: pnpm run typecheck
      - name: lint
        run: pnpm run lint
      # Toda la suite: instrumentada con el umbral por archivo, y aparte las
      # suites pesadas exentas sin instrumentar (scripts/coverage-exempt.ts).
      - name: test + coverage gate
        run: pnpm run check:ci:coverage

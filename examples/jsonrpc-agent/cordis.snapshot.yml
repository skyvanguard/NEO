# Keyless replay includes the live `cordis.yml`, disables the live model
# adapter, and inserts `llm-replay` to serve recorded JSONL without a
# key or network; every other entry remains shared. The replay provider
# catalog claims the `neo-default-route` provider so the SDK server's `initialize`
# finds it owned. The SDK snapshot
# suite passes this path explicitly through `NEO_CORDIS_CONFIG` (the
# jsonrpc-demo bin performs no NEO_SNAPSHOT config swap of its own), and
# `llm-replay` reads `NEO_SNAPSHOT_FILE` / `NEO_SNAPSHOT_CHILD_FILES` from the
# harness. Stdout remains reserved for JSON-RPC frames.
- id: base
  name: '@neo/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      # `name` asserts the target: a mismatch skips the patch and warns only
      # when a logger exists.
      - id: llm-pi-ai
        name: '@neo/llm-pi-ai'
        disabled: true
      - insert:
          - id: llm-replay
            name: '@neo/llm-replay'
            config:
              providers:
                - id: neo-default-route
                  name: NEO Default
                  models:
                    - id: neo-default-model

# Unattended coding-agent deployment for the bundled dsh-jsonrpc-agent runtime.
# stdout is reserved for JSON-RPC; do not add a console logger or terminal UI.

- id: sdk-jsonrpc-server
  name: '@neo/sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: !!js "process.env.NEO_MAX_TOKENS_AS_SUCCESS === undefined ? true : JSON.parse(process.env.NEO_MAX_TOKENS_AS_SUCCESS)"

# One hand-declared OpenAI-compatible route, kept on the `neo-default-route`
# id the SDK initializes. LLM_BASE_URL selects the endpoint (default: a local
# llama-server) and LLM_API_KEY resolves per request. The model arrives over
# JSON-RPC; the Python SDK exports the same id as LLM_MODEL, so the route
# serves exactly the model the session requests.
- id: llm-pi-ai
  name: '@neo/llm-pi-ai'
  config:
    providers:
      neo-default-route:
        api: openai-completions
        baseURL: !!js process.env.LLM_BASE_URL ?? 'http://127.0.0.1:8080/v1'
        apiKeyEnv: LLM_API_KEY
        models:
          - id: !!js process.env.LLM_MODEL ?? 'neo-default-model'

# Managed child-process groups for the bash executor (spawn/kill/output plumbing).
- id: subprocess
  name: '@neo/subprocess-local'

- id: bash
  name: '@neo/bash-local'
  config:
    cwd: !!js process.env.NEO_CWD ?? process.cwd()
    timeoutMs: 60000

- id: agent-spine
  name: '@neo/agent-spine-demo'
  config:
    persona: !!js process.env.NEO_SYSTEM_PROMPT ?? 'You are a coding agent.'
    workspaceContext: false
    skills:
      enabled: false
    toolBash:
      enableRunInBackground: false
    toolJobs: false

- id: sessions
  name: '@neo/session-persistence-jsonl'
  config:
    root: !!js process.env.NEO_SESSION_ROOT ?? './.sessions'
    # Snapshot runs read the raw JSONL back; production keeps zstd frames.
    compression: !!js "process.env.NEO_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: session-checkpoints
  name: '@neo/session-checkpoint-policy'

- id: subagent
  name: '@neo/subagent'

- id: subagent-spawn-in-process
  name: '@neo/subagent-spawn-in-process'
  config:
    providerName: spawn

- id: tool-subagent
  name: '@neo/tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    enableRunInBackground: false

- id: tool-todo
  name: '@neo/tool-todo'
  config:
    allowParallelInProgress: true

- id: fs-local
  name: '@neo/fs-local'
  config:
    cwd: !!js process.env.NEO_CWD ?? process.cwd()

- id: fs-observation-policy
  name: '@neo/fs-observation-policy'

- id: tool-fs
  name: '@neo/tool-fs'

- id: token-meter
  name: '@neo/token-meter'

- id: compaction-basic
  name: '@neo/compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 8192
    compactionRetries: 1

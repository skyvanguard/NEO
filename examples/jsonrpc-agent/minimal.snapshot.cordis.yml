# Keyless replay keeps the complete minimal composition intact and replaces
# only its live model adapter with the fixture-backed provider. The replay
# catalog claims the same route initialized by the SDK.
- id: base
  name: '@neo/cordis-plugin-include'
  config:
    path: ./minimal.cordis.yml
    patches:
      - id: llm-pi-ai
        name: '@neo/llm-pi-ai'
        disabled: true
      - insert:
          - id: llm-replay
            name: '@neo/llm-replay'
            config:
              providers:
                - id: neo-default-route
                  name: NEO Default
                  models:
                    - id: neo-default-model

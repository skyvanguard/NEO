# Keyless composition with NO model adapter mounted: the agent-spine's `main`
# agent still requests the `deepseek-official` route, but nothing registers it,
# so the one-shot prompt fails with NO_ADAPTER. This is the first-run posture of
# a deployment whose base ships no built-in adapter and has no model configured
# yet (only a user-configured pi-ai route serves requests). This snapshot pins
# that failure's headless stream output so a regression in the no-model path is
# caught.
- id: base
  name: '@neo/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      # Drop the live route without inserting replay: nothing else registers
      # `deepseek-official`, so the request fails before any credential or
      # endpoint is consulted.
      - id: llm-pi-ai
        name: '@neo/llm-pi-ai'
        disabled: true

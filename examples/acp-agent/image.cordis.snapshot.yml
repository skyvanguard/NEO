# Keyless replay for the read-image success scenario. Include patches cannot
# target entries behind a nested include, so this restates the replay overlay
# directly over the base cordis.yml (the fs.cordis.snapshot.yml pattern) and
# re-pins the recorded flash model. The replay catalog declares image input on
# flash, so the strict read_image gate accepts the route and the tool result
# carries the durable image block; the live text-only route cannot record this.
- id: base
  name: '@neo/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-pi-ai
        name: '@neo/llm-pi-ai'
        disabled: true
      - id: acp-agent
        name: '@neo/acp-demo'
        config:
          provider: neo-default-route
          model: neo-default-model
          persistenceRoot: !!js process.env.NEO_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
          persistenceCompression: none
          workspaceContext:
            maxBytes: 65536
          persona: |
            You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

            Verify your work by running the code or tests. Keep answers brief and factual.
      - insert:
          - id: attachment-local
            name: '@neo/attachment-local'
          - id: llm-replay
            name: '@neo/llm-replay'
            config:
              providers:
                - id: neo-default-route
                  name: DeepSeek
                  models:
                    - id: neo-default-model
                      inputModalities: [text, image]
                    - id: neo-large-model
                      inputModalities: [text]

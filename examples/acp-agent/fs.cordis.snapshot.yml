# Keyless filesystem snapshots apply the spill and replay overlays directly
# because include patches cannot target entries behind a nested include. The
# sandboxed filesystem stack already lives in the base cordis.yml. This file also
# re-pins the acp-agent model to `neo-default-model`: `cordis.yml` ships
# `neo-large-model`, but the recorded corpus was captured on flash, and a config
# patch replaces the whole app config, so the base fields are restated verbatim.
- id: base
  name: '@neo/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-pi-ai
        name: '@neo/llm-pi-ai'
        disabled: true
      - id: acp-agent
        name: '@neo/acp-demo'
        config:
          provider: neo-default-route
          model: neo-default-model
          persistenceRoot: !!js process.env.NEO_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
          persistenceCompression: none
          workspaceContext:
            maxBytes: 65536
          persona: |
            You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

            Verify your work by running the code or tests. Keep answers brief and factual.
      - insert:
          - id: spill-local
            name: '@neo/spill-local'
            config:
              root: !!js process.env.NEO_SNAPSHOT_SPILL_ROOT ?? './.spill'
          - id: spill-policy
            name: '@neo/spill-policy'
            config:
              maxInlineBytes: 800
          - id: llm-replay
            name: '@neo/llm-replay'
            config:
              providers:
                - id: neo-default-route
                  name: DeepSeek
                  models:
                    - id: neo-default-model
                    - id: neo-large-model

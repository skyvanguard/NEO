# Keyless twin of product-subagent-codex.cordis.yml: keep the same product
# provider/tool composition and replace only the external model adapter.
- id: base
  name: '@neo/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-pi-ai
        name: '@neo/llm-pi-ai'
        disabled: true
      - insert:
          - id: llm-replay
            name: '@neo/llm-replay'
            config:
              providers:
                - id: neo-default-route
                  name: NEO Default
                  models:
                    - id: neo-default-model
                    - id: neo-large-model
          - id: subagent-codex
            name: '@neo/subagent-codex'
          - id: tool-subagent-codex
            name: '@neo/tool-subagent'
            config:
              provider: codex
              toolName: subagent_codex
              enableRunInBackground: false
              maxDepth: provider-managed

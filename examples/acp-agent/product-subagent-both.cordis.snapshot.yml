# Keyless twin of product-subagent-both.cordis.yml: preserve both product
# tools while replacing only the external model adapter.
- id: base
  name: '@neo/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-pi-ai
        name: '@neo/llm-pi-ai'
        disabled: true
      - insert:
          - id: llm-replay
            name: '@neo/llm-replay'
            config:
              providers:
                - id: neo-default-route
                  name: DeepSeek
                  models:
                    - id: neo-default-model
                    - id: neo-large-model
          - id: subagent-codex
            name: '@neo/subagent-codex'
          - id: subagent-claude-code
            name: '@neo/subagent-claude-code'
          - id: tool-subagent-codex
            name: '@neo/tool-subagent'
            config:
              provider: codex
              toolName: subagent_codex
              enableRunInBackground: false
              maxDepth: provider-managed
          - id: tool-subagent-claude-code
            name: '@neo/tool-subagent'
            config:
              provider: claude-code
              toolName: subagent_claude_code
              enableRunInBackground: false
              maxDepth: provider-managed

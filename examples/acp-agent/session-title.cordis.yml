# Session-title snapshot composition: the optional first-prompt provider uses
# the ordinary `neo-default-route` route while the ACP app and every other capability stay
# identical to the base example.
- id: base
  name: '@neo/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - insert:
          - id: session-title-provider
            name: '@neo/session-title-first-prompt-llm'
            config:
              targetWords: 5
              targetCjkCharacters: 10
              maxInputBytes: 4096
              maxOutputTokens: 32
              timeoutMs: 5000
              provider: neo-default-route
              model: neo-default-model

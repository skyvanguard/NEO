# Keyless replay for the retry overlay: disable the live model
# adapter, insert `llm-replay`, and give its provider the same deterministic
# 1 ms zero-jitter retry policy as the live sibling. The app patch still
# restates its whole config for raw JSONL persistence and the recorded model.
- id: base
  name: '@neo/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-pi-ai
        name: '@neo/llm-pi-ai'
        disabled: true
      - id: acp-agent
        name: '@neo/acp-demo'
        config:
          provider: neo-default-route
          model: neo-default-model
          persistenceRoot: !!js process.env.NEO_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
          persistenceCompression: none
          workspaceContext:
            maxBytes: 65536
          persona: |
            You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

            Verify your work by running the code or tests. Keep answers brief and factual.
      - insert:
          - id: llm-replay
            name: '@neo/llm-replay'
            config:
              providers:
                - id: neo-default-route
                  name: DeepSeek
                  retryPolicy:
                    mode: normal
                    maxRetries: 2
                    backoff:
                      initialDelayMs: 1
                      maxDelayMs: 1
                      jitterRatio: 0
                  models:
                    - id: neo-default-model
                    - id: neo-large-model

# Keyless replay counterpart to pty.cordis.yml.
- id: base
  name: '@neo/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-pi-ai
        name: '@neo/llm-pi-ai'
        disabled: true
      - insert:
          - id: pty
            name: '@neo/terminal'
          - id: pty-snapshot-backend
            name: './pty-snapshot-backend.mjs'
          - id: tool-terminal
            name: '@neo/tool-terminal'
            config:
              maxResultBytes: 64
          - id: llm-replay
            name: '@neo/llm-replay'
            config:
              providers:
                - id: neo-default-route
                  name: DeepSeek
                  models:
                    - id: neo-default-model
                    - id: neo-large-model

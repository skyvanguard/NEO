# Minimal live counterpart for the glob-sampling snapshot composition.
- id: llm-pi-ai
  name: '@neo/llm-pi-ai'
  config:
    providers:
      deepseek-official:
        api: openai-completions
        baseURL: !!js process.env.LLM_BASE_URL ?? 'http://127.0.0.1:8080/v1'
        apiKeyEnv: LLM_API_KEY
        models:
          - id: deepseek-v4-pro

- id: subprocess
  name: '@neo/subprocess-local'

- id: bash
  name: '@neo/bash-local'

- id: acp-agent
  name: '@neo/acp-demo'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro
    persistenceRoot: !!js process.env.NEO_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
    persistenceCompression: !!js "process.env.NEO_SNAPSHOT === undefined ? 'zstd' : 'none'"
    workspaceContext: false
    skills:
      enabled: false
    toolJobs: false
    goals: false
    persona: You are a concise snapshot agent working in {{cwd}}.

- id: tool-fs-search
  name: '@neo/tool-fs-search'
  config:
    sampleOverCapGlobResults: true
    globMaxResults: 4

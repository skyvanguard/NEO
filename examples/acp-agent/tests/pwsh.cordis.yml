# Minimal live counterpart for the pwsh-tool-turn snapshot composition.
- id: llm-pi-ai
  name: '@neo/llm-pi-ai'
  config:
    providers:
      neo-default-route:
        api: openai-completions
        baseURL: !!js process.env.LLM_BASE_URL ?? 'http://127.0.0.1:8080/v1'
        apiKeyEnv: LLM_API_KEY
        models:
          - id: neo-large-model

- id: subprocess
  name: '@neo/subprocess-local'

- id: bash
  name: '@neo/pwsh-local'

- id: shell-env
  name: '@neo/shell-env'

- id: acp-agent
  name: '@neo/acp-demo'
  config:
    provider: neo-default-route
    model: neo-large-model
    persistenceRoot: !!js process.env.NEO_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
    persistenceCompression: !!js "process.env.NEO_SNAPSHOT === undefined ? 'zstd' : 'none'"
    workspaceContext: false
    skills:
      enabled: false
    # job_output/job_kill stay mounted (the bundle's toolJobs default) so
    # background pwsh runs are readable and killable.
    goals: false
    # The pwsh tool replaces the bundle's bash tool in this composition.
    toolBash: false
    persona: You are a concise snapshot agent working in {{cwd}}.

- id: tool-pwsh
  name: '@neo/tool-pwsh'

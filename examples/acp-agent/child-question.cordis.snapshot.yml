# Keyless counterpart to child-question.cordis.yml: keep the real interaction
# seam, model-facing tool, and tripwire provider while replacing the live model
# adapter with per-session replay.
- id: base
  name: '@neo/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-pi-ai
        name: '@neo/llm-pi-ai'
        disabled: true
      - id: sandbox
        name: '@neo/sandbox-local'
        config:
          runnerCommand:
            - bash
            - -c
            - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
            - passthrough-runner
          runnerFailureSignatures:
            - 'passthrough-runner: profile rejected'
      - id: acp-agent
        name: '@neo/acp-demo'
        config:
          provider: neo-default-route
          model: neo-default-model
          persistenceRoot: !!js process.env.NEO_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
          persistenceCompression: none
          workspaceContext:
            maxBytes: 65536
          persona: |
            You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

            Verify your work by running the code or tests. Keep answers brief and factual.
      - insert:
          - id: llm-replay
            name: '@neo/llm-replay'
            config:
              providers:
                - id: neo-default-route
                  name: DeepSeek
                  models:
                    - id: neo-default-model
                    - id: neo-large-model
          - id: user-questions
            name: '@neo/user-questions'
          - id: tool-ask-user
            name: '@neo/tool-ask-user'
          - id: child-question-tripwire
            name: './tests/fixtures/child-question-tripwire.ts'

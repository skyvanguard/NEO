# Retry-scenario overlay: pin the bounded transient retry policy to a
# deterministic 1 ms zero-jitter delay so the durable `llm/retry` event
# (`delayMs`) and replay wall time stay reproducible. The overlay changes no
# tool or prompt composition, so its scenarios share the default header class.
# Config patches replace whole plugin configs: the adapter patch restates its
# route around the route-owned `retryPolicy`, while the app patch re-pins the
# recorded flash model and restates its base fields.
- id: base
  name: '@neo/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-pi-ai
        name: '@neo/llm-pi-ai'
        config:
          providers:
            neo-default-route:
              api: openai-completions
              baseURL: !!js process.env.LLM_BASE_URL ?? 'http://127.0.0.1:8080/v1'
              apiKeyEnv: LLM_API_KEY
              retryPolicy:
                mode: normal
                maxRetries: 2
                backoff:
                  initialDelayMs: 1
                  maxDelayMs: 1
                  jitterRatio: 0
              models:
                - id: neo-default-model
                - id: neo-large-model
      - id: acp-agent
        name: '@neo/acp-demo'
        config:
          provider: neo-default-route
          model: neo-default-model
          persistenceRoot: !!js process.env.NEO_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
          persistenceCompression: !!js "process.env.NEO_SNAPSHOT === undefined ? 'zstd' : 'none'"
          workspaceContext:
            maxBytes: 65536
          persona: |
            You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

            Verify your work by running the code or tests. Keep answers brief and factual.
